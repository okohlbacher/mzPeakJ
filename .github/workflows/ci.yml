name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    name: build (JDK ${{ matrix.java }})
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Maven version
        run: ./mvnw -v
      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify

  # Design D-2: on a fresh local repository (no cache), only central and ebi-repo (for jmzML's groups) download
  # anything, and the resolver's group filter and trusted checksums are loaded from .mvn.
  repo-policy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    name: repository policy (JDK 21)
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Set up JDK 21
        uses: actions/setup-java@v4.7.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Maven version
        run: ./mvnw -v
      - name: Repository policy
        run: tools/check-repo-policy.sh
