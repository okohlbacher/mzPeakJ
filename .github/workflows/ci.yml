name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    name: build (JDK ${{ matrix.java }})
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Maven version
        run: ./mvnw -v
      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify

  # Design D-2: on a fresh local repository (no cache), only central and ebi-repo (for jmzML's groups) download
  # anything, and the resolver's group filter and trusted checksums are loaded from .mvn.
  repo-policy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    name: repository policy (JDK 21)
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Set up JDK 21
        uses: actions/setup-java@v4.7.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Maven version
        run: ./mvnw -v
      - name: Repository policy
        run: tools/check-repo-policy.sh

  # Design D-18: the Rust reference reader (tools/rdump, mzpeak_prototyping pinned at 2ee2589) reads the datasets
  # mzPeakJ writes; the build job skips RustReaderAcceptanceTest, which needs the rdump binary.
  rust-reader:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    name: Rust reference reader (JDK 21)
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Set up JDK 21
        uses: actions/setup-java@v4.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set up Rust 1.96.0
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/rdump/target
          key: rdump-${{ runner.os }}-${{ hashFiles('tools/rdump/Cargo.lock') }}
      - name: Build rdump
        run: cargo build --release --locked --manifest-path tools/rdump/Cargo.toml
      - name: Rust reader acceptance test
        run: >-
          ./mvnw -B --no-transfer-progress -pl mzpeakj test -Dtest=RustReaderAcceptanceTest
          -Dsurefire.failIfNoSpecifiedTests=false -Djacoco.skip=true
          -Dmzpeak.rust.rdump=$GITHUB_WORKSPACE/tools/rdump/target/release/rdump
